# Tool settings only: the Salesforce project needs no Python. Python runs the static checks and the reports.
[project]
name = "salesforce-sales-pipeline"
version = "1.0.0"
description = "A written sales-process brief built in Salesforce, every requirement proven by a test. A sample by I-Team Collage."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
